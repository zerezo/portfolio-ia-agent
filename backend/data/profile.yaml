  - id: tfg
    tags: [security, research]
    name:
      en: Multi-Domain Operations Cyber-Risk Simulator
      es: Simulador de riesgos de ciberseguridad para Operaciones Multidominio
    context: { en: "Bachelor's thesis, UPM · Grade 9/10", es: 'TFG, 9/10' }
    stack: [Python, OWL 2, Protégé, HermiT, NIST SP 800-30]
    links:
      - { label: github.com/zerezo/TFG-Alejandro-Cerezo, url: https://github.com/zerezo/TFG-Alejandro-Cerezo }
    bullets:
      - id: tfg-system
        priority: 1
        en: >-
          Knowledge-based system that ingests a military mission scenario and computes cyber-risk
          exposure and resilience across land, sea, air, space and cyber domains.
        es: >-
          Sistema basado en conocimiento que recibe un escenario de misión militar y calcula la
          exposición a riesgos de ciberseguridad y la resiliencia en los dominios tierra, mar, aire,
          espacio y ciberespacio.
      - id: tfg-architecture
        priority: 3
        en: >-
          Hybrid architecture: an OWL 2 DL ontology (Protégé) with the HermiT reasoner classifies assets
          at risk; a Python orchestrator applies the NIST SP 800-30 risk matrix and feeds the results back
          for a global mission verdict.
        es: >-
          Arquitectura híbrida: ontología OWL 2 DL (Protégé) con el razonador HermiT para clasificar los
          activos en riesgo; orquestador en Python que aplica la matriz de riesgos de NIST SP 800-30 y
          devuelve los resultados a la ontología para el veredicto global de la misión.
      - id: tfg-validation
        priority: 3
        en: >-
          Strict schema validation of scenario inputs (JSON), with an automated PDF risk report and the
          inferred knowledge graph exported as an audit trail.
        es: >-
          Validación estricta de los escenarios de entrada (JSON), informe de riesgos automático en PDF y
          exportación del grafo inferido como rastro de auditoría.

