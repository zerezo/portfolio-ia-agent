  - id: entrenador
    priority: 1
    tags: [ai, fde, mcp]
    name:
      en: 'Entrenador: AI training coach on a custom MCP server'
      es: 'Entrenador: coach de entrenamiento con IA sobre un servidor MCP propio'
    context: Cloudflare
    date: '2026'
    stack: [MCP, Claude, Cloudflare, intervals.icu]
    # El panel (entrenador.alejandrocerezo.dev) es privado: la web enlaza al caso de estudio.
    links: []
    bullets:
      # Verificado (2026-11-17) contra el servidor MCP conectado: 24 herramientas (sincronizar,
      # posibles_duplicados/unificar_actividades, calcular_ritmos, resumen_semanal, bienestar,
      # programar_entrenamientos/enviar_a_intervals...) y el panel con login en Cloudflare.
      - id: entrenador-mcp-server
        priority: 1
        en: >-
          Built a remote MCP server with ~25 tools that lets Claude run my multi-sport training: syncs
          activities, detects and merges duplicates across sources, computes paces, weekly load and
          wellness, and schedules structured workouts directly into intervals.icu, with a
          password-protected web panel.
        es: >-
          Servidor MCP remoto con ~25 herramientas con el que Claude gestiona mi entrenamiento
          multideporte: sincroniza actividades, detecta y unifica duplicados entre fuentes, calcula
          ritmos, carga semanal y bienestar, y programa entrenamientos estructurados directamente en
          intervals.icu; panel web protegido.
      # Verificado: herramienta "metodologia" (instrucciones del servidor: seguirla siempre), con
      # progresión de volumen del 5-10 % semanal y carga aguda:crónica entre 0,8 y 1,3.
      - id: entrenador-methodology
        priority: 1
        en: >-
          Encoded a coaching methodology as a tool the model must consult before planning or analysing,
          so decisions follow explicit rules (weekly volume progression, acute:chronic load) instead of
          model guesswork.
        es: >-
          La metodología de entrenamiento está codificada como una herramienta que el modelo debe
          consultar antes de planificar o analizar, de modo que las decisiones siguen reglas explícitas
          (progresión de volumen, carga aguda:crónica) y no intuiciones del modelo.
      - id: entrenador-evals
        tags: [evals]
        en: >-
          Designing an eval suite for the coaching prompt: contrast-pair test cases with code-graded
          verdicts plus an LLM judge for required and forbidden content.
        es: >-
          Diseño de un set de evals para el prompt de coaching: casos en pares de contraste, veredicto
          evaluado por código y un juez LLM para el contenido obligatorio y el prohibido.
    # Caso de estudio (web y agente). Cada sección: párrafos propios o { ref: id de un bullet }.
    # Los párrafos propios los redactó Claude (problema: palabras de Alejandro; el resto, de la
    # metodología del servidor): pendientes de revisión.
    caseStudy:
      id: entrenador-case
      channels: [web, agent]
      problem:
        - id: entrenador-problem
          verified: false
          en: >-
            I wanted a coach with a real methodology and proper data analysis, built on my own training
            log, without paying for a subscription and adapted to my needs. My training was split across
            apps: real-time logging in one, history in another. I wanted one place that combines the best
            of Strava, intervals.icu, Hevy and the rest.
          es: >-
            Quería un entrenador con una metodología real y análisis de datos sobre mi propio registro de
            entrenamientos, sin pagar una suscripción y adaptado a mis necesidades. Mi entrenamiento
            estaba repartido entre apps: el registro en tiempo real en una y el histórico en otra. Quería
            un único lugar que combinara lo mejor de Strava, intervals.icu, Hevy y el resto.
      architecture:
        - id: entrenador-architecture
          verified: false
          en: >-
            A remote MCP server on Cloudflare that Claude uses as a connector, so the same coach works
            from the desktop and from the phone. Activities come from three origins: synced from
            intervals.icu, imported from .fit files (laps, zones and intervals) or logged by hand as a
            provisional entry (RPE, feel and notes). A password-protected web panel shows the plan and
            the saved analyses, and the plan reaches any calendar through an .ics feed.
          es: >-
            Un servidor MCP remoto en Cloudflare que Claude usa como conector, así que el mismo
            entrenador funciona desde el ordenador y desde el móvil. Las actividades tienen tres
            orígenes: sincronizadas desde intervals.icu, importadas de archivos .fit (vueltas, zonas y
            series) o registradas a mano como provisionales (RPE, sensaciones y notas). Un panel web
            protegido con contraseña muestra el plan y los análisis guardados, y el plan llega a
            cualquier calendario con una URL .ics.
      tools:
        - ref: entrenador-mcp-server
      keyDecision:
        - ref: entrenador-methodology
        - id: entrenador-decision-rules
          verified: false
          en: >-
            The methodology is a document deployed with the server and grounded in published
            training science (Daniels' paces, 80/20 polarised training, Gabbett's acute:chronic ratio).
            Adjustments follow a warning system: one off-target key session is only noted, two in a row
            adjust paces or load, and three or a red flag trigger a recovery week. Every analysis is
            saved, so decisions are auditable.
          es: >-
            La metodología es un documento que se despliega con el propio servidor, basado en ciencia
            del entrenamiento publicada (ritmos de Daniels, entrenamiento polarizado 80/20, ratio
            agudo:crónico de Gabbett). Los ajustes siguen un sistema de avisos: una sesión clave fuera de
            objetivo solo se anota, dos seguidas ajustan ritmos o carga, y tres o una señal roja provocan
            una semana de descarga. Cada análisis se guarda, así que las decisiones son auditables.
      evals:
        - ref: entrenador-evals
      next: TODO qué haría después (pendiente de Alejandro)
      screenshots: TODO capturas del panel (sin datos personales)
      video: TODO vídeo corto de una sesión de planificación

