    en: >-
      Telecom engineer (UPM) building LLM agents and MCP integrations in production with Claude Code,
      and working client-facing in English with enterprise teams in Germany and South Korea on
      cybersecurity compliance. I bring both halves of the FDE job: shipping the integration and
      getting it through the security review.
    es: >-
      Ingeniero de Telecomunicación (UPM) que construye agentes LLM e integraciones MCP en producción
      con Claude Code, y que trabaja de cara al cliente, en inglés, con equipos de grandes empresas de
      Alemania y Corea del Sur en cumplimiento de ciberseguridad. Aporto las dos mitades del trabajo de
      un FDE: construir la integración y conseguir que pase la revisión de seguridad.

# Solo LinkedIn. Los textos en español y la ampliación del About los redactó Claude: pendientes de
# revisión (verified: false) hasta que Alejandro los apruebe.
linkedin:
  channels: [linkedin]
  headline:
    id: linkedin-headline
    verified: { en: true, es: false }
    en: >-
      AI / Forward Deployed Engineer · I build and ship LLM agents & MCP servers · Cyber risk &
      compliance (DORA, ISO 27001) · Telecom Engineer (UPM)
    es: >-
      AI / Forward Deployed Engineer · Construyo y despliego agentes LLM y servidores MCP · Riesgo y
      cumplimiento en ciberseguridad (DORA, ISO 27001) · Ingeniero de Telecomunicación (UPM)
  about:
    - id: linkedin-about-intro
      verified: { en: true, es: false }
      en: >-
        I'm a telecom engineer who ships AI products end to end: a production agent with tool calling
        and guardrails, and my own MCP server connecting Claude to live data and external APIs. By day I
        work directly with enterprise clients in Germany and South Korea on cyber risk and compliance.
        I want to be the engineer who
        understands what the customer really needs, builds it, and stays with it from first call to
        production.
      es: >-
        Soy ingeniero de telecomunicación y construyo productos de IA de principio a fin: un agente en
        producción con tool calling y guardrails, y mi propio servidor MCP que conecta Claude con datos
        en tiempo real y APIs externas. En mi trabajo actual trato directamente con clientes de grandes
        empresas en Alemania y Corea del Sur en riesgo y cumplimiento de ciberseguridad. Quiero ser el
        ingeniero que entiende
        lo que el cliente necesita de verdad, lo construye y lo acompaña desde la primera llamada hasta
        producción.
    - id: linkedin-about-build
      verified: false
      en: >-
        What I build: my portfolio at alejandrocerezo.dev is itself a production AI agent. It answers
        questions about my background through an agent loop with tool calling (Claude Haiku in
        production, Ollama locally, behind a provider-agnostic backend), with a zero-cost guard that
        blocks prompt injection before it reaches the model, rate limits, a strict CSP and a
        meeting-request flow with HMAC-signed approvals and email through the Gmail API. I also built
        Entrenador, a remote MCP server on Cloudflare with ~25 tools that lets Claude run my training on
        live data and schedule workouts in intervals.icu, with the coaching methodology encoded as a
        tool the model must consult before deciding anything. I'm now designing evals for it:
        code-graded verdicts plus an LLM judge.
      es: >-
        Qué construyo: mi portfolio en alejandrocerezo.dev es en sí mismo un agente de IA en producción.
        Responde preguntas sobre mi perfil con un bucle agéntico con tool calling (Claude Haiku en
        producción, Ollama en local, con un backend independiente del proveedor), con un guard sin coste
        que bloquea el prompt injection antes de llegar al modelo, rate limiting, una CSP estricta y un
        flujo de solicitud de reuniones con aprobaciones firmadas con HMAC y emails por la Gmail API.
        También he construido Entrenador, un servidor MCP remoto en Cloudflare con ~25 herramientas con
        el que Claude gestiona mi entrenamiento con datos reales y programa entrenamientos en
        intervals.icu, con la metodología de entrenamiento codificada como una herramienta que el modelo
        debe consultar antes de decidir nada. Ahora estoy diseñando sus evals: veredictos evaluados por
        código y un juez LLM.
    - id: linkedin-about-clients
      verified: false
      en: >-
        How I work with clients: I work in English with client teams in Germany and South Korea on
        cybersecurity compliance for the financial-services business of a global automotive group, and
        I run third-party risk assessments for a major Spanish telecom operator. That is where I learned
        the security and compliance questions (ISO/IEC 27001, DORA, third-party risk) that decide whether
        an AI deployment goes live, and where I automated the team's recurring file processing and report
        generation.
      es: >-
        Cómo trabajo con clientes: trabajo en inglés con los equipos del cliente en Alemania y Corea del
        Sur en el cumplimiento de ciberseguridad del negocio de servicios financieros de un grupo
        automovilístico global, y hago evaluaciones de riesgo de proveedores para un gran operador de
        telecomunicaciones español. Ahí he aprendido las preguntas de seguridad y cumplimiento (ISO/IEC
        27001, DORA, riesgo de terceros) que deciden si un despliegue de IA llega a producción, y ahí
        automaticé el procesamiento recurrente de archivos y la generación de informes del equipo.
    - id: linkedin-about-looking
      verified: false
      en: >-
        What I'm looking for: Forward Deployed Engineer, Solutions Engineer or Applied AI roles, in
        Madrid or remote in Europe.
      es: >-
        Qué busco: puestos de Forward Deployed Engineer, Solutions Engineer o Applied AI, en Madrid o en
        remoto en Europa.
