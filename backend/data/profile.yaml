# Perfil profesional de Alejandro Cerezo: FUENTE ÚNICA de la web, del agente del chat (search_cv),
# del CV en PDF (npm run cv) y de los textos de LinkedIn (npm run linkedin).
#
# Cómo se edita (el esquema está en backend/profile/schema.js; npm run profile:check lo valida):
# - Textos: { en, es } o, si no cambian con el idioma (nombres propios), un texto simple.
# - Cada elemento con "id" admite tags, priority, verified y channels. Si no los lleva, los hereda
#   del elemento que lo contiene y, al final, de "defaults".
#   - priority: 1 = imprescindible, 2 = normal, 3 = lo primero que se recorta para que el CV quepa
#     en una página.
#   - verified: false (o { en: true, es: false }) = pendiente de revisar: no sale en ninguna salida.
#   - channels: dónde aparece: web, cv, linkedin, agent.
# - stack (proyectos): tecnologías que muestra la tarjeta de la web y busca el agente; solo las que
#   ya aparecen en los bullets verificados del proyecto.
# - Un texto que empieza por TODO falta por escribir: no sale en ninguna salida.
#   npm run profile:review lista los TODO y lo pendiente de revisar.
# - Repositorio público: nada privado aquí (el teléfono no se guarda en el repo). Nunca se nombran
#   los clientes del trabajo actual: un test lo comprueba en todas las salidas.

defaults:
  channels: [web, cv, linkedin, agent]
  verified: true
  priority: 2

basics:
  name: Alejandro Cerezo Gilarranz
  headline:
