# PostgreSQL para desarrollo local (en producción, el de Railway).
# Uso: docker compose up -d   ·   Parar: docker compose down   ·   Borrar datos: docker compose down -v
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      # Contraseña solo de desarrollo: el puerto solo escucha en 127.0.0.1 (no en la red local).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_dev}
      POSTGRES_DB: portfolio
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # Desde Postgres 18 la imagen guarda los datos bajo /var/lib/postgresql/<versión>.
      - postgres-data:/var/lib/postgresql
      # Crea también la base portfolio_test (tests de integración) la primera vez.
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
