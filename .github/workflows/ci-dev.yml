name: CI - Entorno de Desarrollo

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        
      - name: Preparar entorno de ejecución
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Validar dependencias y seguridad base
        run: |
          echo "Validando estructura del repositorio..."
          echo "Pipeline preparado para escalar."
