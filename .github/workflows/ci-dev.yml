name: CI - Entorno de Desarrollo

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest

    # PostgreSQL efímero para los tests de base de datos (test/db.test.js).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio_ci
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        
      - name: Preparar entorno de ejecución
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Auditoría de seguridad de dependencias
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar sintaxis del servidor
        working-directory: backend
        run: node --check index.js

      - name: Ejecutar tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://portfolio:portfolio_ci@localhost:5432/portfolio_test
        run: npm test

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Auditoría de seguridad del frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Revisar el frontend (nombres sin definir)
        working-directory: frontend
        run: npm run lint

      - name: Compilar el frontend
        working-directory: frontend
        run: npm run build

      - name: Bloquear secretos versionados
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "ERROR: archivo .env versionado"; exit 1
          fi
