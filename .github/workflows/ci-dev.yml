name: CI - Entorno de Desarrollo

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        
      - name: Preparar entorno de ejecución
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Auditoría de seguridad de dependencias
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar sintaxis del servidor
        working-directory: backend
        run: node --check index.js

      - name: Ejecutar tests
        working-directory: backend
        run: npm test

      - name: Bloquear secretos versionados
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "ERROR: archivo .env versionado"; exit 1
          fi
